[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "computercontrol-aim-vr"
version = "3.0.0"
authors = [
  { name = "Arman", email = "rangooniarman@gmail.com" },
]
description = "Industrial SOTA Arch Linux (Hyprland Wayland) Computer Control & Desktop Automation System (AIM-VR 3.0)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Hardware :: Symmetric Multi-processing",
    "Environment :: Wayland",
]
dependencies = [
    "Pillow>=9.0.0",
    "evdev>=1.6.0; sys_platform == 'linux'",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[project.urls]
"Homepage" = "https://github.com/Arman4464/computer-control-aim-vr"
"Bug Tracker" = "https://github.com/Arman4464/computer-control-aim-vr/issues"

[project.scripts]
aimvr = "cli:main"
